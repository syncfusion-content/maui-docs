harnessVersion: "1.0"
profile: dotnet-common
overlays: [syncfusion]
tier: L1

# Generated by harness-creator 2026-10-14 for the Syncfusion .NET CLI (sf).
# Lane split follows the stated target: under 5 minutes for fast PR validation
# (inner), with generated-project and platform integration work separate (outer).

loop:
  maxActive: 1
  maxVerifying: 3
  reviewBlocksPick: true
  requireEvidenceForDone: true
  verifyRetryLimit: 3

lanes:
  inner:
    budgetSeconds: 300
  outer:
    budgetSeconds: 1800

risk:
  requiresHumanApproval:
    - "**/*.csproj"
    - "Directory.Packages.props"
    - "Directory.Build.props"
    - "global.json"
    - "nuget.config"
    - "Jenkinsfile"
    - "build/**"
    - ".github/**"
    - "src/Syncfusion.DotNet.CLI/Commands/**"
    - "src/Syncfusion.DotNet.CLI.Maui/Catalog/*.json"
    - "src/Syncfusion.DotNet.CLI.Blazor/BlazorCatalog.cs"
    - "src/Syncfusion.DotNet.CLI.Core/NuGet/**"

flaky:
  quarantine: []
  retries: 0
  expiresAfterDays: 30

gates:
  - id: build
    tier: L0
    lane: inner
    claim: "the solution builds in Release with analyzers and warnings-as-errors"
    tool: dotnet
    license: "MIT (free, commercial use OK)"
    versionCommand: dotnet --version
    command: dotnet build --nologo -c Release
    parser: msbuild
    threshold: errors == 0 and warnings <= 0
    blocking: true
    installHint: "install the .NET SDK pinned in global.json"
    docs: https://learn.microsoft.com/dotnet/core/tools/dotnet-build
    rationale: "Directory.Build.props already sets TreatWarningsAsErrors and EnforceCodeStyleInBuild; this reads the result."

  - id: harness-verify
    tier: L0
    lane: inner
    claim: "the control plane matches HARNESS-LOCK.json and every cross-reference resolves"
    tool: harness
    license: "n/a (generated)"
    command: python3 .agent/tools/harness.py verify
    parser: exitcode
    threshold: exit == 0
    blocking: true
    docs: references/control-plane.md
    rationale: "Without this, a policy is a markdown file an agent can quietly relax."

  - id: harness-tools-tests
    tier: L1
    lane: inner
    claim: "portable harness helpers preserve coverage collection and audit failure propagation"
    tool: python3
    license: "n/a (in-repo)"
    command: python3 -m unittest discover -s scripts/harness -p test_gate_tools.py
    parser: exitcode
    threshold: exit == 0
    blocking: true

  - id: tests
    tier: L1
    lane: inner
    claim: "the unit and behaviour suite passes (excluding the tracked known-failing tests)"
    tool: dotnet-test
    license: "MIT (free, commercial use OK)"
    command: dotnet test tests --nologo -c Release --no-build --filter "FullyQualifiedName!~PdfViewerResourcesMatchCatalogNames&FullyQualifiedName!~ProjectEmbeddingExcludesMacMetadataAtEveryDepthAndKeepsTemplates&FullyQualifiedName!~InvalidExplicitTargetFramework_FailsBeforeProjectNameQuestion&FullyQualifiedName!~NameConflictAllowsReentryWithoutChangingExistingDestination" --logger "trx;LogFileName={EVIDENCE_DIR}/tests.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/tests.trx"
    threshold: failed == 0 and tests >= 1000
    blocking: true
    ratchet: true
    docs: https://learn.microsoft.com/dotnet/core/tools/dotnet-test
    rationale: "Floor on test count stops a run that silently discovers nothing, or a deleted suite, from passing."

  - id: known-failing
    tier: L1
    lane: inner
    claim: "the 5 tests that fail on a clean checkout (tracked in tasks) are still the only ones failing"
    tool: dotnet-test
    license: "MIT (free, commercial use OK)"
    command: dotnet test tests --nologo -c Release --no-build --filter "FullyQualifiedName~PdfViewerResourcesMatchCatalogNames|FullyQualifiedName~ProjectEmbeddingExcludesMacMetadataAtEveryDepthAndKeepsTemplates|FullyQualifiedName~InvalidExplicitTargetFramework_FailsBeforeProjectNameQuestion|FullyQualifiedName~NameConflictAllowsReentryWithoutChangingExistingDestination" --logger "trx;LogFileName={EVIDENCE_DIR}/known-failing.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/known-failing.trx"
    threshold: failed == 0
    blocking: false
    allowFailure: true
    rationale: "Reports as a warning until fixed. When it passes, remove the exclusion from the tests gate and delete this gate."

  - id: area-command-parsing
    tier: L1
    lane: inner
    claim: "CLI command parsing, taxonomy and argument validation tests ran and pass"
    tool: dotnet-test
    license: "MIT (free, commercial use OK)"
    command: dotnet test tests --nologo -c Release --no-build --filter "FullyQualifiedName~CommandParsingTests|FullyQualifiedName~RootCommandTests|FullyQualifiedName~CommandTaxonomyTests" --logger "trx;LogFileName={EVIDENCE_DIR}/area-command-parsing.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/area-command-parsing.trx"
    threshold: failed == 0 and tests >= 90
    blocking: true
    ratchet: true
    rationale: "Named area evidence: parsing and backward compatibility cannot be satisfied by a green total alone."

  - id: area-wizard-flow
    tier: L1
    lane: inner
    claim: "interactive wizard navigation, conditional prompts, defaults, validation and cancellation tests ran and pass"
    tool: dotnet-test
    license: "MIT (free, commercial use OK)"
    command: dotnet test tests --nologo -c Release --no-build --filter "(FullyQualifiedName~WizardFlowTests|FullyQualifiedName~InteractiveExperienceTests|FullyQualifiedName~NewProjectFlowTests|FullyQualifiedName~ProjectWizardReviewTests|FullyQualifiedName~ProjectFlowLayoutTests|FullyQualifiedName~PromptRenderingTests|FullyQualifiedName~FlowPresentationTests)&FullyQualifiedName!~InvalidExplicitTargetFramework_FailsBeforeProjectNameQuestion&FullyQualifiedName!~NameConflictAllowsReentryWithoutChangingExistingDestination" --logger "trx;LogFileName={EVIDENCE_DIR}/area-wizard-flow.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/area-wizard-flow.trx"
    threshold: failed == 0 and tests >= 140
    blocking: true
    ratchet: true

  - id: area-project-creation-flow
    tier: L1
    lane: inner
    claim: "Project location -> Project name defaults, validation, collisions, cancellation and repeat runs behave the same on MAUI, WPF, WinForms, WinUI and Blazor, from a working directory named dotnet-ui-cli"
    tool: dotnet-test
    license: "MIT (free, commercial use OK)"
    command: dotnet test tests --nologo -c Release --no-build --filter "FullyQualifiedName~ProjectLocationAndNameFlowTests|FullyQualifiedName~ProjectNamingTests|FullyQualifiedName~BlazorLocationAndNameResolutionTests|FullyQualifiedName~BlazorNewCommandDefaultsTests" --logger "trx;LogFileName={EVIDENCE_DIR}/area-project-creation-flow.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/area-project-creation-flow.trx"
    threshold: failed == 0 and tests >= 87
    blocking: true
    ratchet: true
    rationale: "A hyphenated working directory crashed the Blazor wizard before the Project name prompt because no test drove the shared location/name steps from such a directory on every platform."

  - id: area-terminal-rendering
    tier: L1
    lane: inner
    claim: "terminal rendering, cursor, hint, Unicode/ANSI fallback and progress lifecycle tests ran and pass"
    tool: dotnet-test
    license: "MIT (free, commercial use OK)"
    command: dotnet test tests --nologo -c Release --no-build --filter "FullyQualifiedName~TerminalPresentationTests|FullyQualifiedName~PresentationPolishTests|FullyQualifiedName~PresentationRefinementTests|FullyQualifiedName~ProjectCreationProgressTests|FullyQualifiedName~PackageAddPresentationTests|FullyQualifiedName~PackageListPresentationTests|FullyQualifiedName~WelcomeLifecycleTests|FullyQualifiedName~UsabilityRegressionTests" --logger "trx;LogFileName={EVIDENCE_DIR}/area-terminal-rendering.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/area-terminal-rendering.trx"
    threshold: failed == 0 and tests >= 200
    blocking: true
    ratchet: true

  - id: area-home-menu
    tier: L1
    lane: inner
    claim: "home-menu headings use bold uppercase text and capability-aware icons without changing menu navigation"
    tool: dotnet-test
    license: "MIT (free, commercial use OK)"
    command: dotnet test tests --nologo -c Release --no-build --filter "FullyQualifiedName~MenuHeadingsUseBoldCapsAndCapabilityAwareIcons|FullyQualifiedName~MainMenu_|FullyQualifiedName~ExitSelectionKeepsFooterMutedAndClearsTemporaryMenu" --logger "trx;LogFileName={EVIDENCE_DIR}/area-home-menu.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/area-home-menu.trx"
    threshold: failed == 0 and tests >= 16
    blocking: true
    ratchet: true

  - id: area-project-generation
    tier: L1
    lane: inner
    claim: "project generation, catalog, template and per-platform configuration tests ran and pass"
    tool: dotnet-test
    license: "MIT (free, commercial use OK)"
    command: dotnet test tests --nologo -c Release --no-build --filter "(FullyQualifiedName~ProjectGenerationTests|FullyQualifiedName~DesktopPlatformTests|FullyQualifiedName~BlazorPlatformTests|FullyQualifiedName~MauiTemplateNamingTests|FullyQualifiedName~CatalogLoadingTests|FullyQualifiedName~CatalogStandardizationTests|FullyQualifiedName~TemplateResourceEmbeddingTests|FullyQualifiedName~UnsupportedTemplateCleanupTests|FullyQualifiedName~ProjectCreationDiagnosticTests)&FullyQualifiedName!~PdfViewerResourcesMatchCatalogNames&FullyQualifiedName!~ProjectEmbeddingExcludesMacMetadataAtEveryDepthAndKeepsTemplates" --logger "trx;LogFileName={EVIDENCE_DIR}/area-project-generation.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/area-project-generation.trx"
    threshold: failed == 0 and tests >= 420
    blocking: true
    ratchet: true

  - id: area-package-operations
    tier: L1
    lane: inner
    claim: "package add/remove/update, central package management, existing-project resolution, rollback and dry-run tests ran and pass"
    tool: dotnet-test
    license: "MIT (free, commercial use OK)"
    command: dotnet test tests --nologo -c Release --no-build --filter "FullyQualifiedName~CpmRegressionTests|FullyQualifiedName~AddControlSelectionTests|FullyQualifiedName~ExistingProjectResolutionTests|FullyQualifiedName~PathAndPreviewTests|FullyQualifiedName~FileRollbackTests|FullyQualifiedName~DryRunPlanningTests|FullyQualifiedName~NuGetArgumentTests|FullyQualifiedName~PathResolutionTests|FullyQualifiedName~PostCreationBuildTests|FullyQualifiedName~PlaceholderReplacementTests|FullyQualifiedName~ManifestSerializationTests|FullyQualifiedName~EmbeddedResourceLoadingTests|FullyQualifiedName~Phase4Tests|FullyQualifiedName~CoreArchitectureTests|FullyQualifiedName~DotNetHostResolverTests" --logger "trx;LogFileName={EVIDENCE_DIR}/area-package-operations.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/area-package-operations.trx"
    threshold: failed == 0 and tests >= 115
    blocking: true
    ratchet: true

  - id: regression-ledger
    tier: L1
    lane: inner
    claim: "every previously fixed defect class in the ledger still has an existing, passing test"
    tool: python3
    license: "PSF (free, commercial use OK)"
    versionCommand: python3 --version
    command: python3 scripts/harness/check_regression_ledger.py --evidence {EVIDENCE_DIR}
    parser: regex
    parserArgs:
      pattern: "entries=(?P<entries>\\d+) missing=(?P<missing>\\d+) failed=(?P<failed>\\d+)"
    threshold: missing == 0 and failed == 0 and entries >= 20
    blocking: true
    ratchet: true
    rationale: "A ledger entry naming a renamed or deleted test fails here, so a regression test cannot be removed quietly."

  - id: coverage-diff
    tier: L1
    lane: inner
    claim: "lines changed by this task are covered by tests"
    tool: coverlet
    license: "MIT (free, commercial use OK)"
    command: python3 scripts/harness/gate_tools.py coverage "{EVIDENCE_DIR}"
    parser: cobertura-diff
    evidence: "{EVIDENCE_DIR}/cov/coverage.cobertura.xml"
    threshold: diffLineRate >= 0.80
    blocking: true
    ratchet: true
    installHint: "coverlet.collector is already referenced by the test project"
    docs: https://github.com/coverlet-coverage/coverlet
    rationale: "Diff-scoped: new and changed lines must be exercised even though global coverage is not yet measured."

  - id: catalog-audit-tests
    tier: L1
    lane: inner
    claim: "the catalog-audit maintainer tool's own tests pass"
    tool: pytest
    license: "MIT (free, commercial use OK)"
    versionCommand: python3 -m pytest --version
    command: python3 -m pytest -q -p no:cacheprovider tools/catalog-audit
    parser: exitcode
    threshold: exit == 0
    blocking: true

  - id: e2e-workflows
    tier: L1
    lane: outer
    claim: "real sf runs generate every platform, and add/remove/repeat/failure/preservation workflows leave valid projects"
    tool: e2e_workflows.py
    license: "n/a (in-repo)"
    command: python3 scripts/harness/e2e_workflows.py --out {EVIDENCE_DIR}/e2e.json
    parser: jsonpath
    parserArgs:
      paths:
        failed: failed
        passed: passed
        checks: checks
    evidence: "{EVIDENCE_DIR}/e2e.json"
    threshold: failed == 0 and passed >= 90
    timeoutSeconds: 900
    blocking: true
    ratchet: true
    rationale: "Unit tests and a compiled CLI do not prove generated output. This drives the built CLI and asserts on the files it writes. Platforms this host cannot build are counted as skipped, never passed."

  - id: e2e-interactive-wizard
    tier: L1
    lane: outer
    claim: "the real interactive wizard, driven through a pseudo-terminal from a directory named dotnet-ui-cli, shows Project location then Project name, suggests DotnetUiCli, re-prompts on invalid input and creates <location>/<name> on every platform"
    tool: e2e_interactive.py
    license: "n/a (in-repo)"
    command: python3 scripts/harness/e2e_interactive.py --out {EVIDENCE_DIR}/e2e-interactive.json
    parser: jsonpath
    parserArgs:
      paths:
        failed: failed
        passed: passed
        skipped: skipped
    evidence: "{EVIDENCE_DIR}/e2e-interactive.json"
    threshold: failed == 0 and passed >= 25
    timeoutSeconds: 900
    blocking: true
    ratchet: true
    rationale: "Mocked key queues cannot detect a wizard that is not interactive or that throws before its first prompt. MAUI generation is skipped (not passed) on hosts without the MAUI template pack."

  - id: vulnerable-packages
    tier: L1
    lane: outer
    claim: "no known-vulnerable NuGet packages, including transitive"
    tool: dotnet-list-package
    license: "MIT (free, commercial use OK)"
    command: python3 scripts/harness/gate_tools.py vulnerabilities
    parser: exitcode
    threshold: exit == 0
    blocking: true
    rationale: "Needs NuGet network access, so it runs in the outer lane."

skills:
  - id: unit-test
    claim: "the unit suite runs"
    command: dotnet test tests --nologo -c Release
    usedBy: [implementer, test-engineer]
  - id: test-one
    claim: "one named test or class runs, the tight inner loop (append --filter FullyQualifiedName~Name)"
    command: dotnet test tests --nologo -c Release --no-build
    usedBy: [implementer, test-engineer]
  - id: coverage
    claim: "coverage is measured"
    command: dotnet test tests --nologo -c Release --collect:"XPlat Code Coverage"
    usedBy: [test-engineer]
  - id: deps-audit
    claim: "list vulnerable NuGet packages, including transitive"
    command: dotnet list package --vulnerable --include-transitive
    usedBy: [security-auditor, package-integrity-auditor]
  - id: knowledge-lookup
    claim: "list cited knowledge and architecture guidance"
    command: ls .agent/knowledge
    usedBy: [implementer, spec-writer, code-reviewer, wizard-consistency-reviewer, generated-project-validator]
  - id: full-gate
    claim: "every gate runs at full scope"
    command: python3 .agent/tools/harness.py gate run --lane all --scope full
    usedBy: [release-manager]
  - id: e2e-build
    claim: "generated projects restore and build on this host (Windows builds WPF/WinForms/WinUI, a prepared host builds MAUI)"
    command: python3 scripts/harness/e2e_workflows.py --build --out .agent/evidence/e2e-build.json
    usedBy: [generated-project-validator, release-manager]
  - id: e2e-single-platform
    claim: "E2E for one platform (append --platforms wpf|winforms|winui|blazor|maui)"
    command: python3 scripts/harness/e2e_workflows.py --out .agent/evidence/e2e-one.json
    usedBy: [generated-project-validator, implementer]
  - id: desktop-validation
    claim: "Windows only: generate, build and optionally launch advertised desktop configurations"
    command: pwsh scripts/validate-desktop.ps1 -Platform wpf
    usedBy: [generated-project-validator, release-manager]
  - id: catalog-audit
    claim: "advisory NuGet comparison of the curated MAUI package catalog (needs network)"
    command: python3 tools/catalog-audit/audit_package_catalog.py
    usedBy: [package-integrity-auditor]
  - id: sf-help
    claim: "print the real CLI command surface for the compared platform (append: help <platform>)"
    command: dotnet src/Syncfusion.DotNet.CLI/bin/Release/net10.0/Syncfusion.DotNet.CLI.dll
    usedBy: [wizard-consistency-reviewer, code-reviewer]
